services:
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: bris-aqueduc-mlflow-cm
    hostname: mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    ports:
      - "5051:5000"
    volumes:
      - ./mlruns:/mlruns
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5000)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  trainer:
    build:
      context: .
      dockerfile: train/Dockerfile
    container_name: bris-aqueduc-trainer-cm
    volumes:
      - ./mlruns:/mlruns
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bris-aqueduc-api-cm
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://bris-aqueduc-mlflow-cm:5000
      - TRAINER_CONTAINER=bris-aqueduc-trainer-cm
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy
      trainer:
        condition: service_started
    volumes:
      - .:/app
      - ./mlruns:/mlruns
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: bris-aqueduc-frontend-cm
    ports:
      - "8502:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/app